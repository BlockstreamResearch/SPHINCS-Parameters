name: tests

on:
  push:
    branches: [main, stateful]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthesize generated artifacts from the reference model
        run: python3 tests/synth_generated.py
      - name: Run regression suite
        run: GENERATED_REQUIRED=1 python3 tests/run.py
