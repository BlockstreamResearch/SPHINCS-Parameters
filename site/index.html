<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRINCS pinned parameters</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦐</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-index">

  <header>
    <h1>SHRINCS pinned parameters</h1>
    <button type="button" class="glossary-btn" popovertarget="glossary">Glossary</button>
  </header>

  <main>
    <div class="cards">

      <div class="card">
        <h2>Stateless path</h2>
        <p class="tuple">(h, d, k, a, w) = (45, 5, 10, 13, 16)</p>
        <table id="stateless-table"></table>
        <div class="card-link">
          <a id="stateless-link" href="stateless.html#c=45,5,10,13,16">Open in the explorer</a>
        </div>
      </div>

      <div class="card">
        <h2>Stateful path, BXMSS</h2>
        <p class="tuple" id="xmss-tuple">WOTS+C, w = 64, h = 20</p>
        <div class="h-control">
          <label>
            <span class="name">Tree height h</span>
            <input type="number" class="val-input" id="xmss-h-val" min="2" max="20" step="1" value="20">
          </label>
          <input type="range" id="xmss-h" min="2" max="20" step="1" value="20" aria-label="Tree height h">
        </div>
        <table id="xmss-table"></table>
        <div class="card-link">
          <a id="xmss-link" href="stateful.html#cand=xmssmt-WC-64-20-1,uxmss-WC-64">Open in the explorer</a>
        </div>
      </div>

      <div class="card">
        <h2>Stateful, UXMSS</h2>
        <p class="tuple">WOTS+C, w = 64</p>
        <table id="uxmss-table"></table>
        <div class="card-link">
          <a href="stateful.html#cand=xmssmt-WC-64-20-1,uxmss-WC-64">Open in the explorer</a>
        </div>
      </div>

    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/model.js"></script>
  <script src="js/index.js"></script>

</body>

</html>
